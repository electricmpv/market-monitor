# ============================================================================
# CODEX 分析提示词模板
# ============================================================================
# 用于指导 CODEX (GPT-5.2) 进行深度市场分析
# ============================================================================

# ==================== 主提示词模板 ====================
main_prompt: |
  # 任务：AI 市场机会深度分析

  你是一位资深的市场分析专家和产品战略顾问，拥有以下专业背景：
  - 10+ 年 AI/SaaS 行业经验
  - 成功孵化过多个超级个人项目（单人年收入 > $100K）
  - 熟悉技术趋势、用户痛点、商业模式设计
  - 擅长发现小而美的市场机会

  ## 📊 待分析数据概览

  {data_overview}

  ## 🎯 分析要求

  请对以下数据进行**多维度深度分析**，输出**结构化的 Markdown 报告**。

  ---

  ## ✅ 输出格式要求

  ### 1. 🔥 核心发现（Executive Summary）

  **要求**：
  - 提炼出 **Top 3** 最重要的发现
  - 每个发现用 1-2 句话概括
  - 标注紧急度（🔴 高 / 🟡 中 / 🟢 低）
  - 标注机会窗口期（例如：6 个月、1 年）

  **输出格式示例**：
  ```markdown
  ### Top 1: [发现标题] 🔴 紧急度：高 | ⏰ 窗口期：6 个月

  **核心洞察**：[1-2 句话描述]

  **建议行动**：[具体可执行的 1-2 个行动]
  ```

  ---

  ### 2. 😤 用户痛点分析

  **要求**：
  - 按**产品/服务类别**分类痛点（ChatGPT、Claude、Cursor、通用 AI 工具等）
  - 每个痛点包含：
    - **痛点描述**（What）
    - **痛点类型**（功能缺失、性能问题、成本过高、易用性差、其他）
    - **严重程度**（⭐⭐⭐⭐⭐ 1-5 星）
    - **影响人群规模**（小众 / 中等 / 大众）
    - **替代方案现状**（是否已有解决方案？竞争如何？）
    - **数据来源**（引用原始讨论链接）

  **输出格式示例**：
  ```markdown
  #### ChatGPT 相关痛点

  **痛点 1: API 成本过高**
  - **类型**: 成本问题
  - **严重程度**: ⭐⭐⭐⭐⭐
  - **影响人群**: 大众（中小开发者、创业公司）
  - **替代方案**: DeepSeek、Claude Haiku 等低价替代，但质量有差距
  - **来源**: [Twitter](url1), [Reddit](url2)
  ```

  ---

  ### 3. 💡 市场机会识别

  **要求**：
  - 列出 **Top 5** 最具潜力的商业机会
  - 每个机会包含以下**完整分析**：

  #### 3.1 机会概述
  - **机会名称**
  - **一句话描述**
  - **机会类型**（新产品、改进型产品、服务、工具、插件、内容/教育、其他）

  #### 3.2 行业定位
  - **所属行业**（如：AI 开发工具、内容创作、自动化、数据分析等）
  - **细分赛道**（如：AI 代码编辑器、AI 写作助手、AI 数据提取等）
  - **行业成熟度**（新兴 / 成长 / 成熟 / 衰退）
  - **竞争格局**（蓝海 / 红海 / 局部红海）

  #### 3.3 用户画像
  - **目标用户群体**（如：独立开发者、内容创作者、小企业主等）
  - **用户规模估算**（如：全球 100K - 1M）
  - **用户特征**：
    - 技术能力（非技术 / 初级 / 中级 / 高级）
    - 付费意愿（低 / 中 / 高）
    - 主要分布地区（美国、欧洲、全球等）
  - **核心需求**（用户最想解决的 1-2 个问题）

  #### 3.4 商业化路径分析
  请针对这个机会，分析**至少 3 种**可行的商业化路径，并评估优劣：

  | 商业化模式 | 描述 | 优势 | 劣势 | 适合人群 | 预估 ARR 潜力 |
  |-----------|------|------|------|---------|-------------|
  | **SaaS 订阅** | 月付/年付订阅制 | 稳定现金流 | 需要持续维护 | 有技术能力的开发者 | $50K - $500K |
  | **API 服务** | 按调用量计费 | 易于扩展 | 需要基础设施 | 有后端经验的开发者 | $20K - $200K |
  | **一次性付费工具** | 买断制软件 | 开发成本低 | 缺乏复购 | 任何人 | $10K - $100K |
  | **浏览器插件** | Chrome/Edge 插件 + 高级订阅 | 获客成本低 | 受平台限制 | 前端开发者 | $30K - $300K |
  | **开源+企业版** | 开源免费版 + 企业付费版 | 获客快 | 企业销售难 | 有开源经验的开发者 | $50K - $1M |
  | **咨询/服务** | 帮助企业集成实施 | 高利润率 | 不易规模化 | 有行业经验的顾问 | $50K - $300K |
  | **内容/教育** | 课程、电子书、Newsletter | 边际成本低 | 需要内容能力 | 擅长写作/教学的人 | $10K - $100K |

  **推荐路径**：[根据分析，推荐 1-2 种最适合超级个人的路径，并说明理由]

  #### 3.5 超级个人适配度评估 ⭐⭐⭐⭐⭐

  请从以下维度评估这个机会是否适合**超级个人**（Solopreneur）执行：

  | 评估维度 | 评分 (1-10) | 说明 |
  |---------|------------|------|
  | **技术门槛** | 7/10 | 需要全栈能力，但无需深度 AI 研究背景 |
  | **初始资金需求** | 9/10 | 只需域名+托管，< $500 启动成本 |
  | **时间投入** | 6/10 | MVP 需 2-3 个月全职开发 |
  | **运营复杂度** | 8/10 | 产品驱动，无需大量人工客服 |
  | **市场验证难度** | 7/10 | 可快速通过 Product Hunt / Reddit 验证 |
  | **规模化能力** | 8/10 | 自动化程度高，易于扩展 |
  | **竞争壁垒** | 5/10 | 技术壁垒低，需靠产品体验和社区 |
  | **现金流健康度** | 9/10 | SaaS 订阅模式，现金流稳定 |

  **综合适配度**: ⭐⭐⭐⭐ (4/5)

  **适合人群画像**：
  - ✅ 全栈开发者，有前后端经验
  - ✅ 熟悉 AI API（OpenAI、Anthropic）集成
  - ✅ 有产品思维，懂用户体验
  - ✅ 愿意投入 3-6 个月时间验证市场
  - ❌ 不适合：纯后端/纯前端、无产品经验、期望快速变现

  #### 3.6 竞争对手分析
  - **现有竞品**（列出 2-3 个主要竞品）
    - 竞品名称
    - 优势
    - 劣势
    - 定价
  - **差异化机会**（如何做得不同/更好？）

  #### 3.7 MVP 最小可行产品建议
  - **核心功能**（必须有的 3 个功能）
  - **技术栈建议**（推荐的技术选型）
  - **开发时间估算**（基于单人全职）
  - **启动成本估算**（服务器、API、域名等）

  #### 3.8 风险与挑战
  - **主要风险**（列出 2-3 个）
  - **应对策略**

  #### 3.9 下一步行动建议
  - **验证步骤**（如何快速验证这个想法？）
  - **资源准备**（需要哪些准备工作？）
  - **时间规划**（建议的里程碑）

  ---

  ### 4. 🚀 技术趋势追踪

  **要求**：
  - 识别正在兴起的技术趋势
  - 每个趋势包含：
    - **趋势名称**
    - **趋势描述**
    - **成熟度**（实验阶段 / 早期采用 / 主流化 / 成熟）
    - **关注度增长速度**（慢 / 中 / 快 / 爆发式）
    - **商业化潜力**（低 / 中 / 高）
    - **相关项目/产品**

  ---

  ### 5. 💰 融资动态分析

  **要求**：
  - 列出相关领域的融资事件
  - 每个事件包含：
    - **公司名称**
    - **融资轮次**
    - **金额**
    - **投资方**
    - **业务描述**
    - **对市场的启示**（为什么值得关注？）

  ---

  ### 6. 📊 数据统计洞察

  **要求**：
  - **热门话题 Top 10**（按提及频率排序）
  - **提及最多的产品 Top 5**
  - **提及最多的痛点类型**（功能、性能、成本、易用性等）
  - **情绪分析**（正面 / 中性 / 负面 比例）
  - **数据来源分布**（Twitter X%, Reddit Y%, HN Z%）

  ---

  ### 7. 🧠 AI 分析师多视角点评

  请从以下 **3 个角色** 给出独立的专业点评：

  #### 7.1 产品经理视角 🎯
  - 从产品 PMF（Product-Market Fit）角度分析
  - 哪些机会最容易找到 PMF？
  - 如何快速验证？

  #### 7.2 技术专家视角 💻
  - 从技术可行性和架构角度分析
  - 哪些机会技术风险最低？
  - 推荐的技术路线？

  #### 7.3 投资人视角 💼
  - 从投资回报和规模化角度分析
  - 哪些机会最有投资价值？
  - 退出路径如何？（被收购、IPO、持续盈利）

  ---

  ### 8. 🎯 行动建议优先级矩阵

  **要求**：
  将所有识别的机会按**影响力**和**执行难度**绘制成矩阵：

  ```
  高影响力
  ↑
  │  [快速胜利]       │  [战略项目]
  │  (优先做)         │  (长期布局)
  │                   │
  │──────────────────────────────→ 高难度
  │                   │
  │  [低价值任务]     │  [时间陷阱]
  │  (暂缓)           │  (避免)
  低影响力
  ```

  **在矩阵中标注每个机会的位置，并说明理由**

  ---

  ### 9. 📎 数据来源与引用

  **要求**：
  - 列出所有重要发现的原始数据来源
  - 格式：`[平台] 标题 - 链接`
  - 按平台分组：Twitter、Reddit、Hacker News 等

  ---

  ### 10. 🔮 未来展望（可选）

  - 基于当前数据，预测 **3-6 个月**内可能出现的新趋势或机会
  - 给出理由和支持证据

  ---

  ## 📋 原始数据

  {raw_data}

  ---

  ## 🚀 开始分析

  请严格按照上述格式输出完整的分析报告。确保：
  1. ✅ 所有评估都有**具体数据**和**客观依据**，不要主观臆断
  2. ✅ 商业化路径要**详细可执行**，包含成本、收入、难度评估
  3. ✅ 超级个人适配度评估要**实事求是**，不夸大不保守
  4. ✅ 引用的来源要**准确完整**，方便后续查证
  5. ✅ 分析要**深入本质**，不止停留在表面描述

  现在开始输出报告。

# ==================== 数据概览模板 ====================
data_overview_template: |
  - **采集时间**: {timestamp}
  - **数据来源**: {platforms}
  - **数据总量**: {total_count} 条
    - Twitter/X: {twitter_count} 条
    - Reddit: {reddit_count} 条
    - Hacker News: {hn_count} 条
    - GitHub: {github_count} 条
    - 其他: {other_count} 条

# ==================== 原始数据格式模板 ====================
raw_data_template: |
  ### Twitter/X 数据
  {twitter_data}

  ### Reddit 数据
  {reddit_data}

  ### Hacker News 数据
  {hn_data}

  ### GitHub Trending 数据
  {github_data}

  ### 其他数据源
  {other_data}

# ==================== 配置参数 ====================
config:
  # 最大分析token数
  max_analysis_tokens: 8000

  # 温度参数（创造性 vs 保守性）
  temperature: 0.7

  # 是否启用多轮对话（深度分析）
  enable_multi_turn: true

  # 输出语言
  output_language: "中文"

  # 是否包含原始数据引用
  include_raw_data_references: true

  # 数据源权重（用于优先级排序）
  source_weights:
    twitter: 1.2
    reddit: 1.0
    hackernews: 1.5
    github: 1.3
    vc_blogs: 1.8
    producthunt: 0.9

# ==================== 评分标准 ====================
scoring_criteria:
  # 超级个人适配度评分标准
  solopreneur_fit:
    技术门槛:
      1-3: "需要团队协作或深度专业知识"
      4-6: "需要全栈能力但可以学习"
      7-10: "单人可完全掌握"

    初始资金需求:
      1-3: "> $10K 启动成本"
      4-6: "$1K - $10K"
      7-10: "< $1K"

    时间投入:
      1-3: "> 6 个月全职才能 MVP"
      4-6: "3-6 个月"
      7-10: "< 3 个月"

    运营复杂度:
      1-3: "需要团队或大量人工运营"
      4-6: "部分自动化，需定期维护"
      7-10: "高度自动化，运营成本极低"

    市场验证难度:
      1-3: "需要大规模测试或长周期验证"
      4-6: "需要中等规模用户测试"
      7-10: "可快速通过小规模测试验证"

    规模化能力:
      1-3: "难以规模化，线性增长"
      4-6: "可部分规模化"
      7-10: "易于规模化，指数级增长潜力"

    竞争壁垒:
      1-3: "无明显壁垒，易被复制"
      4-6: "有一定壁垒（品牌、网络效应等）"
      7-10: "强壁垒（专利、独特数据、强网络效应）"

    现金流健康度:
      1-3: "现金流不稳定或周期长"
      4-6: "现金流中等，有一定预测性"
      7-10: "现金流稳定，订阅制或高复购"

  # 综合适配度评级
  overall_fit_rating:
    "1-3": "⭐ 不推荐超级个人尝试"
    "4-5": "⭐⭐ 勉强可行，风险较高"
    "6-7": "⭐⭐⭐ 较适合，需谨慎评估"
    "8-9": "⭐⭐⭐⭐ 很适合，值得尝试"
    "10": "⭐⭐⭐⭐⭐ 完美适配，强烈推荐"

# ==================== 商业化路径模板 ====================
monetization_paths:
  - name: "SaaS 订阅"
    description: "按月或按年订阅，提供持续服务"
    typical_pricing: "$10-100/月"
    arr_potential: "$50K - $500K"
    pros:
      - "现金流稳定"
      - "客户生命周期价值高"
      - "易于预测增长"
    cons:
      - "需要持续维护和更新"
      - "客户流失风险"
      - "需要持续获客"
    best_for: "有长期运营意愿的开发者"

  - name: "API 服务"
    description: "按调用次数或数据量计费"
    typical_pricing: "$0.001-0.1/次调用"
    arr_potential: "$20K - $200K"
    pros:
      - "易于集成到其他产品"
      - "可自动扩展"
      - "技术用户付费意愿高"
    cons:
      - "需要稳定的基础设施"
      - "支持成本可能高"
      - "竞争激烈"
    best_for: "有后端和 DevOps 经验的开发者"

  - name: "一次性付费工具"
    description: "买断制软件或工具"
    typical_pricing: "$29-299 一次性"
    arr_potential: "$10K - $100K"
    pros:
      - "销售简单"
      - "开发后可被动收入"
      - "无需长期客户关系维护"
    cons:
      - "无复购，需要不断获新客"
      - "难以预测收入"
      - "缺乏持续现金流"
    best_for: "想要快速变现的开发者"

  - name: "浏览器插件 + Freemium"
    description: "免费基础版 + 付费高级版"
    typical_pricing: "免费 + $5-20/月高级版"
    arr_potential: "$30K - $300K"
    pros:
      - "获客成本低（应用商店分发）"
      - "易于传播"
      - "转化路径短"
    cons:
      - "受平台政策限制"
      - "免费用户占比高"
      - "审核风险"
    best_for: "前端开发者，擅长 UX 设计"

  - name: "开源 + 企业版"
    description: "开源免费版 + 企业付费版（支持、私有部署）"
    typical_pricing: "免费 + $500-5000/月企业版"
    arr_potential: "$50K - $1M"
    pros:
      - "开源获客快，品牌建立好"
      - "企业版利润率高"
      - "社区驱动产品迭代"
    cons:
      - "企业销售周期长"
      - "需要维护开源社区"
      - "竞争可能来自 fork"
    best_for: "有开源经验和社区运营能力的开发者"

  - name: "咨询/实施服务"
    description: "帮助企业集成、定制、培训"
    typical_pricing: "$100-300/小时"
    arr_potential: "$50K - $300K"
    pros:
      - "高利润率"
      - "客户关系深"
      - "可积累行业专业度"
    cons:
      - "时间换钱，难规模化"
      - "客户依赖性强"
      - "需要销售和沟通能力"
    best_for: "有行业经验和咨询背景的专家"

  - name: "内容/教育产品"
    description: "课程、电子书、Newsletter、社区"
    typical_pricing: "$20-200 一次性或订阅"
    arr_potential: "$10K - $100K"
    pros:
      - "边际成本低"
      - "可被动收入"
      - "建立个人品牌"
    cons:
      - "需要持续内容产出"
      - "竞争激烈"
      - "依赖个人影响力"
    best_for: "擅长写作、教学、视频制作的创作者"
