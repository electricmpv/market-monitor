    - "paying users"
    - "retention rate"
    - "conversion rate"
    - "PMF"  # Product-Market Fit
    - "waitlist"
    - "sold out"

  # 创业和 Solo 创业
  indie_startup:
    - "solo founder"
    - "bootstrapped"
    - "side project"
    - "built in public"
    - "indie hacker"
    - "solopreneur"
    - "maker"
