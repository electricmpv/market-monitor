# ============================================================================
# 高信噪比关键词配置
# ============================================================================
# 这些关键词经过精心挑选，能够有效识别有价值的市场信号
# 同时过滤掉噪音和低质量内容
# ============================================================================

# ==================== 强痛点信号词 ====================
# 这些词组合通常表示用户遇到了真实的问题
strong_pain_signals:
  # 表达挫败感的词
  frustration:
    - "so frustrating"
    - "driving me crazy"
    - "waste of time"
    - "can't believe"
    - "ridiculous"
    - "unacceptable"
    - "disappointed"
    - "fed up with"

  # 表达需求未被满足
  unmet_needs:
    - "wish there was"
    - "need something that"
    - "looking for alternative"
    - "better solution"
    - "anyone know of"
    - "recommend a tool"
    - "switching from"

  # 表达功能缺失
  missing_features:
    - "doesn't support"
    - "can't do"
    - "missing feature"
    - "no way to"
    - "would be nice if"
    - "hoping for"
    - "still waiting for"

  # 表达性能/质量问题
  quality_issues:
    - "too slow"
    - "keeps failing"
    - "constantly errors"
    - "quality dropped"
    - "not reliable"
    - "inconsistent results"
    - "broken since update"

  # 表达成本问题
  cost_issues:
    - "too expensive"
    - "pricing is insane"
    - "can't afford"
    - "looking for cheaper"
    - "free alternative"
    - "pricing model sucks"

# ==================== 市场机会信号词 ====================
