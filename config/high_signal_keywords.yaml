# ==================== 组合规则 ====================
# 高信噪比的关键词组合规则
combination_rules:
  # 强痛点 = 产品名 + 痛点词
  strong_pain_pattern:
    format: "[产品名] + [痛点词]"
    examples:
      - "ChatGPT too expensive"
      - "Cursor keeps crashing"
      - "Claude API slow"
    weight: 2.0  # 权重，用于排序

  # 强机会 = 行动词 + 市场
  strong_opportunity_pattern:
    format: "[行动词] + [市场/问题]"
    examples:
      - "launched AI writing tool"
      - "raised $2M for AI agent"
      - "built AI code reviewer"
    weight: 1.8

  # 趋势 = 新技术 + 采用信号
  trend_pattern:
    format: "[新技术] + [采用/讨论]"
    examples:
      - "RAG pipeline popular"
      - "everyone using AI agents"
      - "vector databases trending"
    weight: 1.5

# ==================== 上下文增强词 ====================
# 这些词单独出现价值不高，但与核心关键词组合时能增强信号
context_enhancers:
  quantifiers:
    - "100+ users"
    - "thousands of"
    - "millions in revenue"
    - "10x growth"
    - "doubled"

  time_markers:
    - "this week"
    - "just released"
    - "coming next month"
    - "in 2024"
    - "past year"

  credibility_markers:
    - "Forbes featured"
    - "TechCrunch covered"
    - "YC backed"
    - "acquired by"
    - "funded by a16z"

# ==================== 使用说明 ====================
usage_notes: |
  1. **组合使用**: 单个关键词价值有限，应该组合使用（如：产品名 + 痛点词）
  2. **权重排序**: 使用 weight 字段对匹配结果排序，优先处理高权重内容
  3. **动态更新**: 根据实际数据质量定期更新关键词列表
  4. **A/B 测试**: 新增关键词先小规模测试，验证信噪比后再全量使用
  5. **排除优先**: 噪音过滤词应该优先执行，避免浪费 LLM token

# ==================== 评估指标 ====================
evaluation_metrics:
  # 关键词效果评估
  keyword_performance:
    signal_to_noise_ratio: "匹配内容中高质量内容占比"
    precision: "匹配的内容中相关内容占比"
    recall: "相关内容中被匹配到的占比"
    actionable_rate: "匹配内容中可执行机会占比"

  # 目标基准
  target_benchmarks:
    signal_to_noise_ratio: "> 0.7"  # 70% 以上是高质量
    precision: "> 0.8"
    recall: "> 0.6"
    actionable_rate: "> 0.3"  # 30% 以上能转化为行动
