# ==================== 配置 ====================
monitoring_config:
  # 高优先级账号的检查频率（分钟）
  high_priority_check_interval: 30

  # 中优先级账号的检查频率（分钟）
  medium_priority_check_interval: 120

  # 低优先级账号的检查频率（分钟）
  low_priority_check_interval: 360

  # 最小互动阈值（按优先级）
  engagement_thresholds:
    high_priority:
      min_likes: 10
      min_retweets: 2
    medium_priority:
      min_likes: 20
      min_retweets: 5
    low_priority:
      min_likes: 50
      min_retweets: 10

# ==================== 内容过滤规则 ====================
content_filters:
  # 关注的话题标签
  relevant_hashtags:
    - "#AI"
    - "#MachineLearning"
    - "#LLM"
    - "#ChatGPT"
    - "#Claude"
    - "#Startup"
    - "#IndieHacker"
    - "#SaaS"
    - "#ProductLaunch"
    - "#BuildInPublic"

  # 排除的内容类型
  exclude_types:
    - "pure_retweet"  # 纯转发（无评论）
    - "promotional"   # 纯广告
    - "personal"      # 个人生活（非相关）
